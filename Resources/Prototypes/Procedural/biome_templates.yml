# Contains several biomes
- type: biomeTemplate
  id: Continental
  layers:
    terrain:
      dungeon: ContinentalTerrain

- type: dungeon
  id: ContinentalTerrain
  layers:
    - !type:SampleMetaLayer
      template: Lava
    - !type:SampleMetaLayer
      template: Caves
      threshold: -0.5
      noise:
        frequency: 0.001
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 2
        lacunarity: 2
    - !type:SampleMetaLayer
      template: Grasslands
      threshold: 0
      noise:
        frequency: 0.001
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 2
        lacunarity: 2
    - !type:SampleMetaLayer
      template: Snow
      threshold: 0.5
      noise:
        frequency: 0.001
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 2
        lacunarity: 2

# Desert
# TODO: Water in desert
- type: biomeTemplate
  id: LowDesert
  layers:
    terrain:
      dungeon: LowDesertTerrain

- type: dungeon
  id: LowDesertTerrain
  layers:
    # Sparse rocks
    - !type:SampleEntityLayer
      threshold: 0.95
      noise:
        seed: 0
        frequency: 2
        noiseType: OpenSimplex2
      allowedTiles:
        - FloorAsteroidSand
      entities:
        - FloraRockSolid

    # Large rock areas
    - !type:SampleEntityLayer
      threshold: -0.20
      noise:
        seed: 0
        frequency: 0.04
        noiseType: Cellular
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance2
      allowedTiles:
        - FloorAsteroidSand
      entities:
        - WallRockSand
    - !type:SampleDummyLayer
      id: Loot

    # Fill layer
    - !type:SampleTileLayer
      threshold: -1
      tile: FloorAsteroidSand

# Grass
- type: biomeTemplate
  id: Grasslands
  layers:
    terrain:
      dungeon: GrasslandsTerrain

- type: dungeon
  id: GrasslandsTerrain
  layers:
  # Sparse vegetation
  - !type:SampleDecalLayer
    allowedTiles:
    - FloorPlanetGrass
    divisions: 2
    threshold: -0.50
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 1
    decals:
    - BushDOne
    - BushDTwo
    - BushDThree
  - !type:SampleDecalLayer
    allowedTiles:
    - FloorPlanetGrass
    noise:
      seed: 0
      noiseType: OpenSimplex2
      frequency: 1
    divisions: 1
    threshold: 0.8
    decals:
    - FlowersBROne
    - FlowersBRTwo
    - FlowersBRThree
  # Dense vegetation
  - !type:SampleDecalLayer
    allowedTiles:
    - FloorPlanetGrass
    divisions: 1
    threshold: -0.35
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.2
      fractalType: FBm
      octaves: 5
      lacunarity: 2
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    decals:
    - BushAOne
    - BushATwo
    - BushAThree
    - BushCOne
    - BushCTwo
    - BushCThree
  - !type:SampleEntityLayer
    threshold: 0.5
    noise:
      seed: 0
      noiseType: OpenSimplex2
      fractalType: FBm
      frequency: 2
    allowedTiles:
    - FloorPlanetGrass
    entities:
    - FloraTree
    - FloraTreeLarge
  # Rock formations
  - !type:SampleEntityLayer
    allowedTiles:
    - FloorPlanetGrass
    - FloorPlanetDirt
    threshold: -0.30
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.05
      lacunarity: 2
      fractalType: FBm
      octaves: 5
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    entities:
    - WallRock
  - !type:SampleDummyLayer
    id: Loot
  # Water
  - !type:SampleEntityLayer
    allowedTiles:
    - FloorPlanetGrass
    - FloorPlanetDirt
    threshold: 0.95
    noise:
      seed: 3
      noiseType: OpenSimplex2
      frequency: 0.003
      lacunarity: 1.50
      fractalType: Ridged
      octaves: 1
    entities:
    - FloorWaterEntity
  # Fill remainder with dirt.
  - !type:SampleTileLayer
    threshold: -1.0
    tile: FloorPlanetDirt
  - !type:SampleTileLayer
    threshold: -0.90
    tile: FloorPlanetGrass
    noise:
      seed: 0
      frequency: 0.02
      fractalType: None
  # Water sand
  - !type:SampleTileLayer
    tile: FloorPlanetDirt
    threshold: 0.95
    noise:
      seed: 3
      noiseType: OpenSimplex2
      frequency: 0.003
      lacunarity: 1.50
      fractalType: Ridged
      octaves: 1
  # Rock formation sand
  - !type:SampleTileLayer
    tile: FloorPlanetDirt
    threshold: -0.30
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.05
      lacunarity: 2
      fractalType: FBm
      octaves: 5
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2

# Lava
- type: biomeTemplate
  id: Lava
  layers:
    terrain:
      dungeon: LavaTerrain

- type: dungeon
  id: LavaTerrain
  layers:
    - !type:SampleEntityLayer
      threshold: 0.9
      noise:
        frequency: 1
        seed: 2
      allowedTiles:
        - FloorBasalt
      entities:
        - BasaltOne
        - BasaltTwo
        - BasaltThree
        - BasaltFour
        - BasaltFive
    - !type:SampleDecalLayer
      allowedTiles:
        - FloorBasalt
      threshold: 0.9
      divisions: 1
      noise:
        seed: 1
        frequency: 1
      decals:
        - Basalt1
        - Basalt2
        - Basalt3
        - Basalt4
        - Basalt5
        - Basalt6
        - Basalt7
        - Basalt8
        - Basalt9
    - !type:SampleEntityLayer
      threshold: 0.95
      noise:
        seed: 0
        noiseType: OpenSimplex2
        frequency: 1
      allowedTiles:
        - FloorBasalt
      entities:
        - FloraRockSolid
    - !type:SampleEntityLayer
      threshold: 0.2
      noise:
        seed: 0
        frequency: 0.02
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        gain: 0.4
      allowedTiles:
        - FloorBasalt
      entities:
        - FloorLavaEntity
    # Rock formations
    - !type:SampleEntityLayer
      allowedTiles:
        - FloorBasalt
      threshold: -0.30
      noise:
        seed: 0
        noiseType: Cellular
        frequency: 0.05
        lacunarity: 2
        fractalType: FBm
        octaves: 5
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance2
      entities:
        - WallRockBasalt
    # Fill basalt
    - !type:SampleTileLayer
      threshold: -1
      tile: FloorBasalt

# Snow
- type: biomeTemplate
  id: Snow # Similar to Grasslands... but snow
  layers:
    terrain:
      dungeon: SnowTerrain

- type: dungeon
  id: SnowTerrain
  layers:
    # Sparse vegetation
    - !type:SampleDecalLayer
      allowedTiles:
        - FloorSnow
      divisions: 2
      threshold: -0.50
      noise:
        seed: 0
        noiseType: Cellular
        frequency: 1
      decals:
        - grasssnowa1
        - grasssnowa2
        - grasssnowa3
        - grasssnowb1
        - grasssnowb2
        - grasssnowb3
        - grasssnowc1
        - grasssnowc2
        - grasssnowc3
    # Dense, bland grass
    - !type:SampleDecalLayer
      allowedTiles:
        - FloorSnow
      divisions: 1
      threshold: -0.35
      noise:
        seed: 0
        noiseType: Cellular
        frequency: 0.2
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance2
      decals:
        - grasssnow
        - grasssnow01
        - grasssnow02
        - grasssnow03
        - grasssnow04
        - grasssnow05
        - grasssnow06
        - grasssnow07
        - grasssnow08
        - grasssnow09
        - grasssnow10
        - grasssnow11
        - grasssnow12
        - grasssnow13
    # Little bit of coloured grass
    - !type:SampleDecalLayer
      allowedTiles:
        - FloorSnow
      divisions: 1
      threshold: -0.0
      noise:
        seed: 0
        noiseType: Cellular
        frequency: 1
        fractalType: None
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance2
      decals:
        - bushsnowa1
        - bushsnowa2
        - bushsnowa3
        - bushsnowb3
        - bushsnowb2
        - bushsnowb3
    - !type:SampleEntityLayer
      threshold: 0.5
      noise:
        seed: 0
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - FloorSnow
      entities:
        - FloraTreeSnow
    # Rock formations
    - !type:SampleEntityLayer
      allowedTiles:
        - FloorSnow
      threshold: -0.30
      noise:
        seed: 0
        noiseType: Cellular
        frequency: 0.05
        lacunarity: 2
        fractalType: FBm
        octaves: 5
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance2
      entities:
        - WallRockSnow
    # Ice tiles
    - !type:SampleTileLayer
      tile: FloorIce
      threshold: -0.9
      noise:
        seed: 0
        noiseType: Cellular
        frequency: 0.03
        lacunarity: 2
        fractalType: FBm
        octaves: 5
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance2
    # Liquid plasma rivers. Ice moon baby
    - !type:SampleEntityLayer
      allowedTiles:
      - FloorSnow
      - FloorIce
      threshold: 0.95
      noise:
        seed: 3
        noiseType: OpenSimplex2
        frequency: 0.003
        lacunarity: 1.50
        fractalType: Ridged
        octaves: 1
      entities:
      - FloorLiquidPlasmaEntity
    - !type:SampleTileLayer
      threshold: -0.7
      tile: FloorSnow
      noise:
        seed: 0
        frequency: 0.02
        fractalType: None

# Shadow -> Derived from lava
- type: biomeTemplate
  id: Shadow
  layers:
    terrain:
      dungeon: ShadowTerrain

- type: dungeon
  id: ShadowTerrain
  layers:
  - !type:SampleEntityLayer
    threshold: 0.70
    noise:
      frequency: 1
      seed: 3
    allowedTiles:
      - FloorChromite
    entities:
      - ShadowBasaltOne
      - ShadowBasaltTwo
      - ShadowBasaltThree
      - ShadowBasaltFour
      - ShadowBasaltFive
  - !type:SampleEntityLayer
    threshold: 0.97
    noise:
      frequency: 1
      seed: 2
    allowedTiles:
      - FloorChromite
    entities:
      - CrystalPink
  - !type:SampleEntityLayer
    threshold: 0.97
    noise:
      seed: 1
      noiseType: OpenSimplex2
      frequency: 1
    allowedTiles:
      - FloorChromite
    entities:
      - ShadowTree
  # Rock formations
  - !type:SampleEntityLayer
    threshold: -0.2
    invert: true
    noise:
      seed: 0
      noiseType: Perlin
      fractalType: Ridged
      octaves: 1
      frequency: 0.1
      gain: 0
    allowedTiles:
      - FloorChromite
    entities:
      - WallRockChromite
  # chasm time
  - !type:SampleEntityLayer
    allowedTiles:
    - FloorChromite
    threshold: 0.2
    noise:
      seed: 3
      frequency: 0.1
      fractalType: FBm
      octaves: 5
      lacunarity: 2
      gain: 0.4
    entities:
    - FloorChromiteChasm
  # Fill chromite
  - !type:SampleTileLayer
    threshold: -1
    tile: FloorChromite

