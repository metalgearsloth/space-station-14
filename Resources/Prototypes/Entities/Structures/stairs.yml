    drawdepth: FloorTiles

- type: entity
  abstract: true
  parent: BaseFloorDecoration
  id: BaseZLevelLadder
  name: z-level ladder
  description: A ladder connecting two aligned z-levels.
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_stage_steel
    drawdepth: SmallObjects
  - type: ZLevelLadder

- type: entity
  parent: BaseZLevelLadder
  id: ZLevelLadderUp
  suffix: up
  components:
  - type: ZLevelPortal
    destinationOffset: 1
    counterpartPrototype: ZLevelLadderDown

- type: entity
  parent: BaseZLevelLadder
  id: ZLevelLadderDown
  suffix: down
  components:
  - type: ZLevelPortal
    destinationOffset: -1
    counterpartPrototype: ZLevelLadderUp
