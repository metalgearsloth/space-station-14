- type: entity
  abstract: true
  id: BaseFloorDecoration
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Sprite
    drawdepth: FloorTiles

- type: entity
  parent: [ BaseFloorDecoration, StructureHealthFurnitureStrong ]
  id: Stairs
  name: stairs
  suffix: Steel
  description: The greatest invention since rocket-propelled grenades.
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_steel
  - type: Damageable
    damageModifierSet: SteelStaticMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  id: StairStage
  parent: Stairs
  suffix: Steel, stage
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_stage_steel
    drawdepth: FloorTiles

- type: entity
  id: StairWhite
  parent: Stairs
  suffix: White
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_white
    drawdepth: FloorTiles

- type: entity
  id: StairStageWhite
  parent: Stairs
  suffix: White, stage
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_stage_white
    drawdepth: FloorTiles

- type: entity
  id: StairDark
  parent: Stairs
  suffix: Dark
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_dark
    drawdepth: FloorTiles

- type: entity
  id: StairStageDark
