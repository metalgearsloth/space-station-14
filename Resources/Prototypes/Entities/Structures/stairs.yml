- type: entity
  abstract: true
  id: BaseFloorDecoration
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Sprite
    drawdepth: FloorTiles

- type: entity
  parent: [ BaseFloorDecoration, StructureHealthFurnitureStrong ]
  id: Stairs
  name: stairs
  suffix: Steel
  description: The greatest invention since rocket-propelled grenades.
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_steel
  - type: Damageable
    damageModifierSet: SteelStaticMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  id: StairStage
  parent: Stairs
  suffix: Steel, stage
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_stage_steel
    drawdepth: FloorTiles

- type: entity
  id: StairWhite
  parent: Stairs
  suffix: White
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_white
    drawdepth: FloorTiles

- type: entity
  id: StairStageWhite
  parent: Stairs
  suffix: White, stage
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_stage_white
    drawdepth: FloorTiles

- type: entity
  id: StairDark
  parent: Stairs
  suffix: Dark
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_dark
    drawdepth: FloorTiles

- type: entity
  id: StairStageDark
  parent: Stairs
  suffix: Dark, stage
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_stage_dark
    drawdepth: FloorTiles

- type: entity
  id: StairWood
  parent: Stairs
  suffix: Wood
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_wood
    drawdepth: FloorTiles

- type: entity
  id: StairStageWood
  parent: Stairs
  suffix: Wood, stage
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_stage_wood
    drawdepth: FloorTiles

- type: entity
  abstract: true
  parent: Stairs
  id: BaseZLevelRamp
  name: z-level ramp
  description: A directional transition between two aligned z-levels.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: false
  - type: Rotatable
  - type: Physics
    bodyType: Static

- type: entity
  parent: BaseZLevelRamp
  id: ZLevelRampUp
  suffix: Steel, up
  components:
  - type: ZLevelPortalTrigger
    transitionFixture: zLevelTransition
    direction: 0,1
  - type: ZLevelPortal
    destinationOffset: 1
    counterpartPrototype: ZLevelRampDown
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.45
    sprintSpeedModifier: 0.45
  - type: Fixtures
    fixtures:
      zLevelTransition:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,0,0.5,0.25"
        hard: false
      zLevelSlowdown:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        hard: false
        mask:
        - ItemMask
        layer:
        - SlipLayer
      zLevelExitGate:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,0.25,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer

- type: entity
  parent: BaseZLevelRamp
  id: ZLevelRampDown
  suffix: Steel, down
  components:
  - type: ZLevelPortalTrigger
    transitionFixture: zLevelTransition
    direction: 0,1
  - type: ZLevelPortal
    destinationOffset: -1
    counterpartPrototype: ZLevelRampUp
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.45
    sprintSpeedModifier: 0.45
  - type: Fixtures
    fixtures:
      zLevelTransition:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.25,0.5,0"
        hard: false
      zLevelSlowdown:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        hard: false
        mask:
        - ItemMask
        layer:
        - SlipLayer
      zLevelExitGate:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,-0.25"
        mask:
        - FullTileMask
        layer:
        - WallLayer

- type: entity
  parent: ZLevelRampUp
  id: ZLevelRampUpWhite
  suffix: White, up
  components:
  - type: ZLevelPortal
    counterpartPrototype: ZLevelRampDownWhite
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_white
    drawdepth: FloorTiles

- type: entity
  parent: ZLevelRampDown
  id: ZLevelRampDownWhite
  suffix: White, down
  components:
  - type: ZLevelPortal
    counterpartPrototype: ZLevelRampUpWhite
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_white
    drawdepth: FloorTiles

- type: entity
