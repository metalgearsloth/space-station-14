    state: stairs_dark
    drawdepth: FloorTiles

- type: entity
  parent: ZLevelRampUp
  id: ZLevelRampUpWood
  suffix: Wood, up
  components:
  - type: ZLevelPortal
    counterpartPrototype: ZLevelRampDownWood
  - type: Sprite
